[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path (on every host alias, e.g. twilight.checkins.party)
# is served by index.html and routed client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build output can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything the update path depends on must be revalidated on every check so a
# midday deploy reaches phones within one update interval.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/passports/index.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/passports/:id/passport.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/passports/:id/*.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Passport art and audio are addressed with ?v=<version>, so a version bump
# busts them instantly; otherwise they may be reused for an hour.
[[headers]]
  for = "/passports/:id/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
